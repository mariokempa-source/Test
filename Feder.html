<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Feder</title>
<style>
  @font-face {
    font-family: 'Georgia-fallback';
    src: local('Georgia');
  }
  :root{
    --paper: #efe7d8;
    --paper-dim: #e3d9c4;
    --ink: #2b2622;
    --ink-soft: #6b5f52;
    --rule: #c9bda3;
    --wine: #7a2e2e;
    --wine-soft: #a3524f;
    --gold: #a3823a;
    --panel: #241f1b;
    --panel-ink: #e9dfc9;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background: var(--panel);
    color:var(--ink);
    font-family: 'Iowan Old Style','Palatino Linotype','Georgia-fallback',Georgia,serif;
    overflow:hidden;
  }

  /* ===== App shell ===== */
  #app{
    display:flex;
    height:100vh;
    height:100dvh;
  }

  /* ===== Sidebar (Kartei) ===== */
  #sidebar{
    width:280px;
    min-width:280px;
    background: var(--panel);
    color: var(--panel-ink);
    display:flex;
    flex-direction:column;
    border-right: 1px solid #3a332c;
    transition: margin-left .28s ease;
  }
  #sidebar.collapsed{ margin-left:-280px; }
  .brand{
    padding:22px 20px 14px;
    border-bottom: 1px solid #3a332c;
  }
  .brand .mark{
    font-size:11px;
    letter-spacing:.25em;
    text-transform:uppercase;
    color: var(--gold);
    margin-bottom:4px;
  }
  .brand h1{
    margin:0;
    font-size:26px;
    font-weight:400;
    font-style:italic;
    letter-spacing:.01em;
  }
  #newStoryBtn{
    margin:14px 16px;
    padding:10px 14px;
    background:transparent;
    border:1px solid var(--gold);
    color:var(--gold);
    font-family:inherit;
    font-size:14px;
    letter-spacing:.04em;
    cursor:pointer;
    border-radius:2px;
  }
  #newStoryBtn:active{ background: var(--gold); color:#241f1b; }

  #storyList{
    flex:1;
    overflow-y:auto;
    padding: 4px 8px 16px;
  }
  .story-item{
    padding:12px 12px;
    margin:2px 0;
    border-radius:3px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:3px;
    border-left: 2px solid transparent;
  }
  .story-item:active{ background:#332c25; }
  .story-item.active{ background:#332c25; border-left-color: var(--wine-soft); }
  .story-item .title{ font-size:15px; color:var(--panel-ink); }
  .story-item .meta{ font-size:11px; color:#8a8071; letter-spacing:.03em; }

  .sidebar-foot{
    padding:12px 16px 18px;
    border-top:1px solid #3a332c;
    font-size:11px;
    color:#8a8071;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .sidebar-foot button{
    background:none;border:none;color:var(--gold);font-family:inherit;font-size:11px;cursor:pointer;letter-spacing:.05em;text-transform:uppercase;
  }

  /* ===== Main writing surface ===== */
  #main{
    flex:1;
    display:flex;
    flex-direction:column;
    background: var(--paper);
    background-image:
      radial-gradient(ellipse at top left, rgba(255,255,255,.15), transparent 60%);
    min-width:0;
  }
  #topbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--rule);
    background: var(--paper-dim);
  }
  #menuToggle{
    background:none;border:none; padding:6px; cursor:pointer;
    color:var(--ink); font-size:18px; line-height:1;
  }
  #titleInput{
    flex:1;
    background:transparent;
    border:none;
    font-family:inherit;
    font-size:19px;
    font-style:italic;
    color:var(--ink);
    outline:none;
    min-width:0;
  }
  #titleInput::placeholder{ color:var(--ink-soft); }
  .icon-btn{
    background:none;
    border:1px solid var(--rule);
    color:var(--ink-soft);
    font-family:inherit;
    font-size:12px;
    letter-spacing:.03em;
    padding:7px 11px;
    border-radius:2px;
    cursor:pointer;
    white-space:nowrap;
  }
  .icon-btn:active{ background: var(--rule); }

  #editorWrap{
    flex:1;
    overflow-y:auto;
    display:flex;
    justify-content:center;
  }
  #editor{
    width:100%;
    max-width:720px;
    min-height:100%;
    padding: 48px 28px 220px;
    background:transparent;
    border:none;
    outline:none;
    resize:none;
    font-family: inherit;
    font-size:18px;
    line-height:1.75;
    color:var(--ink);
  }
  #editor::placeholder{ color:var(--ink-soft); font-style:italic; }

  /* ===== Bottom control bar ===== */
  #controlbar{
    border-top:1px solid var(--rule);
    background: var(--paper-dim);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  }
  .row{
    display:flex;
    gap:8px;
    align-items:center;
    margin-bottom:8px;
  }
  .row:last-child{ margin-bottom:0; }
  select, .promptbox{
    font-family: inherit;
  }
  select{
    background: var(--paper);
    border:1px solid var(--rule);
    color:var(--ink);
    padding:8px 8px;
    border-radius:2px;
    font-size:13px;
    flex:0 0 auto;
  }
  #promptInput{
    flex:1;
    min-width:0;
    background: var(--paper);
    border:1px solid var(--rule);
    border-radius:2px;
    color:var(--ink);
    font-size:15px;
    padding:9px 12px;
    outline:none;
  }
  #promptInput:focus, select:focus{ border-color: var(--wine-soft); }

  #genBtn{
    background: var(--wine);
    color:#f2e8d8;
    border:none;
    padding:9px 18px;
    border-radius:2px;
    font-family:inherit;
    font-size:14px;
    letter-spacing:.03em;
    cursor:pointer;
    flex:0 0 auto;
  }
  #genBtn:active{ background: var(--wine-soft); }
  #genBtn:disabled{ opacity:.5; }

  .modebar{
    display:flex; gap:6px; font-size:12px;
  }
  .mode-chip{
    padding:6px 12px;
    border:1px solid var(--rule);
    border-radius:12px;
    color:var(--ink-soft);
    cursor:pointer;
    background:transparent;
    font-family:inherit;
  }
  .mode-chip.active{
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  .status{
    font-size:11px;
    color: var(--ink-soft);
    flex:1 0 auto;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  /* ===== Settings modal ===== */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(20,16,12,.55);
    display:flex; align-items:center; justify-content:center;
    z-index:50; padding:20px;
  }
  .modal{
    background: var(--paper);
    color: var(--ink);
    width:100%; max-width:440px;
    border-radius:4px;
    padding:26px;
    max-height:85vh;
    overflow-y:auto;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .modal h2{
    margin:0 0 4px;
    font-style:italic;
    font-weight:400;
    font-size:22px;
  }
  .modal .sub{ font-size:12px; color:var(--ink-soft); margin-bottom:20px; }
  .field{ margin-bottom:16px; }
  .field label{
    display:block; font-size:11px; text-transform:uppercase; letter-spacing:.06em;
    color: var(--ink-soft); margin-bottom:6px;
  }
  .field input, .field textarea{
    width:100%;
    font-family: inherit;
    background:#fff;
    border:1px solid var(--rule);
    padding:9px 10px;
    border-radius:2px;
    font-size:14px;
    color:var(--ink);
    outline:none;
  }
  .field textarea{ resize:vertical; min-height:70px; line-height:1.4; }
  .field input:focus, .field textarea:focus{ border-color: var(--wine-soft); }
  .modal-actions{
    display:flex; justify-content:flex-end; gap:10px; margin-top:22px;
  }
  .btn-ghost{
    background:none; border:1px solid var(--rule); color:var(--ink-soft);
    padding:9px 16px; border-radius:2px; font-family:inherit; font-size:13px; cursor:pointer;
  }
  .btn-solid{
    background: var(--wine); color:#f2e8d8; border:none;
    padding:9px 16px; border-radius:2px; font-family:inherit; font-size:13px; cursor:pointer;
  }
  .preset-list{ display:flex; flex-direction:column; gap:8px; }
  .preset-row{
    display:flex; gap:8px; align-items:center;
  }
  .preset-row input{ flex:1; }
  .preset-row button{
    background:none; border:1px solid var(--rule); color:var(--wine);
    width:34px; height:34px; border-radius:2px; cursor:pointer; font-size:16px;
  }
  .add-preset{
    margin-top:8px; background:none; border:1px dashed var(--rule); color:var(--ink-soft);
    padding:8px; width:100%; border-radius:2px; font-family:inherit; font-size:13px; cursor:pointer;
  }

  /* ===== Character bar ===== */
  .charbar-row{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:8px;
  }
  .charbar-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color: var(--ink-soft);
    flex:0 0 auto;
  }
  .char-chip{
    padding:5px 11px;
    border-radius:12px;
    border:1px solid var(--rule);
    background:transparent;
    color:var(--ink-soft);
    font-family:inherit;
    font-size:12px;
    cursor:pointer;
    white-space:nowrap;
  }
  .char-chip.active{
    background: var(--wine);
    border-color: var(--wine);
    color:#f2e8d8;
  }
  .char-chip-add{
    padding:5px 11px;
    border-radius:12px;
    border:1px dashed var(--gold);
    background:transparent;
    color: var(--gold);
    font-family:inherit;
    font-size:12px;
    cursor:pointer;
    white-space:nowrap;
  }
  .char-chip-random{
    padding:5px 11px;
    border-radius:12px;
    border:1px solid var(--gold);
    background: var(--gold);
    color:#2b2622;
    font-family:inherit;
    font-size:12px;
    cursor:pointer;
    white-space:nowrap;
  }
  .char-chip-random:disabled{ opacity:.5; }

  .char-list-modal{ display:flex; flex-direction:column; gap:10px; margin-bottom:6px; }
  .char-card{
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
    padding:10px; border:1px solid var(--rule); border-radius:3px; background:#fff;
  }
  .char-card .name{ font-weight:600; font-size:14px; margin-bottom:3px; }
  .char-card .desc{ font-size:12.5px; color: var(--ink-soft); line-height:1.4; }
  .char-card button{
    background:none; border:1px solid var(--rule); color:var(--wine);
    width:28px; height:28px; border-radius:2px; cursor:pointer; font-size:14px; flex:0 0 auto;
  }

  /* empty state */
  #emptyState{
    flex:1; display:flex; align-items:center; justify-content:center;
    flex-direction:column; text-align:center; padding:40px;
    color: var(--ink-soft);
  }
  #emptyState .mark{
    font-size:11px; letter-spacing:.25em; text-transform:uppercase; color:var(--gold); margin-bottom:10px;
  }
  #emptyState h2{ font-style:italic; font-weight:400; font-size:26px; color:var(--ink); margin:0 0 10px; }
  #emptyState p{ max-width:340px; font-size:14px; line-height:1.6; margin:0 0 20px; }

  @media (max-width: 720px){
    #sidebar{ position:fixed; z-index:40; height:100%; box-shadow: 8px 0 30px rgba(0,0,0,.4); }
    #sidebar.collapsed{ margin-left:-280px; }
    #sidebar:not(.collapsed){ margin-left:0; }
    #titleInput{ font-size:17px; }
    #editor{ font-size:17px; padding:32px 18px 200px; }
    .modebar{ flex-wrap:wrap; }
  }
</style>
</head>
<body>

<div id="app">
  <div id="sidebar">
    <div class="brand">
      <div class="mark">Feder</div>
      <h1>Kartei</h1>
    </div>
    <button id="newStoryBtn">+ Neue Geschichte</button>
    <div id="storyList"></div>
    <div class="sidebar-foot">
      <span id="storyCount">0 Geschichten</span>
      <button id="settingsBtn">Einstellungen</button>
    </div>
  </div>

  <div id="main">
    <div id="topbar">
      <button id="menuToggle">☰</button>
      <input id="titleInput" placeholder="Ohne Titel" />
      <button class="icon-btn" id="exportBtn">Export</button>
      <button class="icon-btn" id="deleteBtn">Löschen</button>
    </div>

    <div id="editorWrap">
      <textarea id="editor" placeholder="Beginne hier zu schreiben, oder gib unten einen Impuls ein und lass die Geschichte anfangen…"></textarea>
    </div>

    <div id="controlbar">
      <div class="charbar-row" id="charbarRow">
        <span class="charbar-label">Figuren</span>
        <div id="charChips" style="display:flex; gap:6px; flex-wrap:wrap;"></div>
        <button class="char-chip-add" id="openCharModalBtn">+ Charakter</button>
        <button class="char-chip-random" id="randomCharBtn">🎲 Zufällig einfügen</button>
      </div>
      <div class="row">
        <div class="modebar" id="modebar">
          <button class="mode-chip active" data-mode="continue">Fortsetzen</button>
          <button class="mode-chip" data-mode="rewrite">Umschreiben</button>
          <button class="mode-chip" data-mode="scratch">Neu ab Impuls</button>
        </div>
        <span class="status" id="statusLine">Bereit</span>
      </div>
      <div class="row">
        <select id="presetSelect"></select>
        <input id="promptInput" placeholder="Impuls, Richtung oder Anweisung für die nächste Passage…" />
        <button id="genBtn">Schreiben</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="charModal" style="display:none;">
  <div class="modal">
    <h2>Figurenkartei</h2>
    <div class="sub">Alle Charaktere über alle Geschichten hinweg. Angehakte Figuren werden in der aktuellen Geschichte als Kontext an die KI mitgegeben.</div>

    <div class="char-list-modal" id="charListModal"></div>

    <div class="field">
      <label>Neue Figur — Name</label>
      <input type="text" id="newCharName" placeholder="z. B. Elena">
    </div>
    <div class="field">
      <label>Beschreibung / Persönlichkeit / Merkmale</label>
      <textarea id="newCharDesc" placeholder="Aussehen, Charakterzüge, Hintergrund, Sprechweise…"></textarea>
    </div>
    <button class="btn-ghost" id="addCharBtn" style="width:100%;">+ Figur zur Kartei hinzufügen</button>

    <div class="modal-actions">
      <button class="btn-solid" id="closeCharModal">Fertig</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="settingsModal" style="display:none;">
  <div class="modal">
    <h2>Einstellungen</h2>
    <div class="sub">Verbindung zu OpenRouter und deine Presets.</div>

    <div class="field">
      <label>OpenRouter API-Key</label>
      <input type="password" id="apiKeyInput" placeholder="sk-or-…" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>

    <div class="field">
      <label>Presets</label>
      <div class="preset-list" id="presetList"></div>
      <button class="add-preset" id="addPresetBtn">+ Preset hinzufügen</button>
    </div>

    <div class="field">
      <label>Standard-Systemanweisung (optional, gilt für alle Presets ohne eigene)</label>
      <textarea id="systemPromptInput" placeholder="z. B. Ton, Perspektive, Stilvorgaben für deine Geschichten…"></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn-ghost" id="closeSettings">Schließen</button>
      <button class="btn-solid" id="saveSettings">Speichern</button>
    </div>
  </div>
</div>

<script>
(function(){
  const LS_STORIES = 'feder_stories_v1';
  const LS_SETTINGS = 'feder_settings_v1';
  const LS_CHARACTERS = 'feder_characters_v1';

  let state = {
    stories: [],
    activeId: null,
    characters: [],
    settings: {
      apiKey: '',
      presets: [
        { name: 'mario', model: '@preset/mario', system: '' },
        { name: 'storys', model: '@preset/storys', system: '' },
        { name: 'ministral', model: '@preset/ministral', system: '' }
      ],
      defaultSystem: ''
    }
  };

  function load(){
    try{
      const s = JSON.parse(localStorage.getItem(LS_STORIES) || '[]');
      state.stories = Array.isArray(s) ? s : [];
    }catch(e){ state.stories = []; }
    try{
      const st = JSON.parse(localStorage.getItem(LS_SETTINGS) || 'null');
      if(st) state.settings = Object.assign(state.settings, st);
    }catch(e){}
    try{
      const c = JSON.parse(localStorage.getItem(LS_CHARACTERS) || '[]');
      state.characters = Array.isArray(c) ? c : [];
    }catch(e){ state.characters = []; }
  }
  function saveStories(){ localStorage.setItem(LS_STORIES, JSON.stringify(state.stories)); }
  function saveSettings(){ localStorage.setItem(LS_SETTINGS, JSON.stringify(state.settings)); }
  function saveCharacters(){ localStorage.setItem(LS_CHARACTERS, JSON.stringify(state.characters)); }

  // ===== DOM refs =====
  const sidebar = document.getElementById('sidebar');
  const storyList = document.getElementById('storyList');
  const storyCount = document.getElementById('storyCount');
  const titleInput = document.getElementById('titleInput');
  const editor = document.getElementById('editor');
  const menuToggle = document.getElementById('menuToggle');
  const newStoryBtn = document.getElementById('newStoryBtn');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsModal = document.getElementById('settingsModal');
  const closeSettings = document.getElementById('closeSettings');
  const saveSettingsBtn = document.getElementById('saveSettings');
  const apiKeyInput = document.getElementById('apiKeyInput');
  const presetList = document.getElementById('presetList');
  const addPresetBtn = document.getElementById('addPresetBtn');
  const systemPromptInput = document.getElementById('systemPromptInput');
  const presetSelect = document.getElementById('presetSelect');
  const promptInput = document.getElementById('promptInput');
  const genBtn = document.getElementById('genBtn');
  const statusLine = document.getElementById('statusLine');
  const modebar = document.getElementById('modebar');
  const exportBtn = document.getElementById('exportBtn');
  const deleteBtn = document.getElementById('deleteBtn');
  const charChips = document.getElementById('charChips');
  const openCharModalBtn = document.getElementById('openCharModalBtn');
  const randomCharBtn = document.getElementById('randomCharBtn');
  const charModal = document.getElementById('charModal');
  const charListModal = document.getElementById('charListModal');
  const newCharName = document.getElementById('newCharName');
  const newCharDesc = document.getElementById('newCharDesc');
  const addCharBtn = document.getElementById('addCharBtn');
  const closeCharModal = document.getElementById('closeCharModal');

  let mode = 'continue';

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function getActive(){ return state.stories.find(s => s.id === state.activeId); }

  function renderStoryList(){
    storyList.innerHTML = '';
    const sorted = [...state.stories].sort((a,b) => b.updated - a.updated);
    storyCount.textContent = state.stories.length + (state.stories.length === 1 ? ' Geschichte' : ' Geschichten');
    sorted.forEach(s => {
      const div = document.createElement('div');
      div.className = 'story-item' + (s.id === state.activeId ? ' active' : '');
      const words = (s.text || '').trim().split(/\s+/).filter(Boolean).length;
      div.innerHTML = `<div class="title">${escapeHtml(s.title || 'Ohne Titel')}</div><div class="meta">${words} Wörter · ${formatDate(s.updated)}</div>`;
      div.addEventListener('click', () => { selectStory(s.id); if(window.innerWidth <= 720) sidebar.classList.add('collapsed'); });
      storyList.appendChild(div);
    });
  }

  function formatDate(ts){
    const d = new Date(ts);
    return d.toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit'}) + ' ' + d.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});
  }
  function escapeHtml(str){
    return (str||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function selectStory(id){
    state.activeId = id;
    const s = getActive();
    titleInput.value = s ? (s.title || '') : '';
    editor.value = s ? (s.text || '') : '';
    renderStoryList();
    renderCharChips();
    editor.focus();
  }

  function newStory(){
    const s = { id: uid(), title: '', text: '', updated: Date.now(), characterIds: [] };
    state.stories.push(s);
    saveStories();
    selectStory(s.id);
  }

  // ===== Characters =====
  function renderCharChips(){
    const s = getActive();
    const activeIds = (s && s.characterIds) || [];
    charChips.innerHTML = '';
    state.characters.forEach(c => {
      const chip = document.createElement('button');
      chip.className = 'char-chip' + (activeIds.includes(c.id) ? ' active' : '');
      chip.textContent = c.name;
      chip.title = c.desc || '';
      chip.addEventListener('click', () => {
        if(!s) return;
        s.characterIds = s.characterIds || [];
        const idx = s.characterIds.indexOf(c.id);
        if(idx >= 0) s.characterIds.splice(idx, 1);
        else s.characterIds.push(c.id);
        s.updated = Date.now();
        saveStories();
        renderCharChips();
        renderStoryList();
      });
      charChips.appendChild(chip);
    });
  }

  function renderCharListModal(){
    charListModal.innerHTML = '';
    if(!state.characters.length){
      charListModal.innerHTML = '<div style="font-size:13px; color:var(--ink-soft);">Noch keine Figuren angelegt.</div>';
      return;
    }
    state.characters.forEach(c => {
      const card = document.createElement('div');
      card.className = 'char-card';
      card.innerHTML = `<div style="flex:1; min-width:0;"><div class="name">${escapeHtml(c.name)}</div><div class="desc">${escapeHtml(c.desc||'')}</div></div><button data-del="${c.id}">×</button>`;
      charListModal.appendChild(card);
    });
    charListModal.querySelectorAll('button[data-del]').forEach(btn => {
      btn.addEventListener('click', e => {
        const id = e.target.dataset.del;
        state.characters = state.characters.filter(c => c.id !== id);
        state.stories.forEach(s => { if(s.characterIds) s.characterIds = s.characterIds.filter(cid => cid !== id); });
        saveCharacters();
        saveStories();
        renderCharListModal();
        renderCharChips();
      });
    });
  }

  openCharModalBtn.addEventListener('click', () => {
    renderCharListModal();
    charModal.style.display = 'flex';
  });
  closeCharModal.addEventListener('click', () => charModal.style.display = 'none');

  addCharBtn.addEventListener('click', () => {
    const name = newCharName.value.trim();
    const desc = newCharDesc.value.trim();
    if(!name) return;
    const c = { id: uid(), name, desc };
    state.characters.push(c);
    saveCharacters();
    const s = getActive();
    if(s){ s.characterIds = s.characterIds || []; s.characterIds.push(c.id); saveStories(); }
    newCharName.value = '';
    newCharDesc.value = '';
    renderCharListModal();
    renderCharChips();
  });

  function activeCharacterContext(){
    const s = getActive();
    if(!s || !s.characterIds || !s.characterIds.length) return '';
    const chars = state.characters.filter(c => s.characterIds.includes(c.id));
    if(!chars.length) return '';
    return '\n\nFiguren in dieser Geschichte (bleibe konsistent zu ihnen):\n' +
      chars.map(c => `- ${c.name}: ${c.desc || 'keine weitere Beschreibung'}`).join('\n');
  }

  async function generateRandomCharacter(){
    const presetIdx = presetSelect.value;
    const preset = state.settings.presets[presetIdx];
    if(!preset || !preset.model){ statusLine.textContent = 'Kein Preset gewählt.'; return; }
    if(!state.settings.apiKey){ statusLine.textContent = 'Kein API-Key hinterlegt.'; openSettings(); return; }

    randomCharBtn.disabled = true;
    statusLine.textContent = 'Erfinde neue Figur …';

    const existingNames = state.characters.map(c => c.name).join(', ') || 'keine bisher';
    const existingText = editor.value.slice(-3000);

    try{
      const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + state.settings.apiKey,
          'HTTP-Referer': 'https://feder.local',
          'X-Title': 'Feder'
        },
        body: JSON.stringify({
          model: preset.model,
          temperature: 1.0,
          messages: [
            { role: 'system', content: 'Du erschaffst Charaktere für erzählende Prosa. Antworte AUSSCHLIESSLICH mit einem JSON-Objekt der Form {"name": "...", "desc": "..."}, ohne Markdown, ohne Erklärung, ohne Code-Fences.' },
            { role: 'user', content:
              `Bisheriger Ausschnitt der Geschichte (falls vorhanden):\n${existingText || '(noch keine Handlung)'}\n\n` +
              `Bereits existierende Figuren: ${existingNames}\n\n` +
              `Erfinde eine neue, zur bisherigen Geschichte passende Figur (nicht identisch mit bestehenden). Gib Name und eine prägnante Beschreibung (Aussehen, Persönlichkeit, Rolle) in 2-4 Sätzen.` }
          ]
        })
      });
      if(!res.ok) throw new Error(`API-Fehler ${res.status}`);
      const data = await res.json();
      let content = data.choices?.[0]?.message?.content || '';
      content = content.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
      const parsed = JSON.parse(content);
      if(!parsed.name) throw new Error('Keine gültige Figur erhalten.');
      const c = { id: uid(), name: parsed.name, desc: parsed.desc || '' };
      state.characters.push(c);
      saveCharacters();
      const s = getActive();
      if(s){ s.characterIds = s.characterIds || []; s.characterIds.push(c.id); saveStories(); }
      renderCharChips();
      statusLine.textContent = `Neue Figur: ${c.name}`;
    } catch(err){
      statusLine.textContent = 'Fehler bei Figur-Generierung: ' + err.message;
    } finally {
      randomCharBtn.disabled = false;
    }
  }
  randomCharBtn.addEventListener('click', generateRandomCharacter);

  function persistActive(){
    const s = getActive();
    if(!s) return;
    s.title = titleInput.value;
    s.text = editor.value;
    s.updated = Date.now();
    saveStories();
  }

  let saveTimer = null;
  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { persistActive(); renderStoryList(); }, 500);
  }

  titleInput.addEventListener('input', scheduleSave);
  editor.addEventListener('input', scheduleSave);

  menuToggle.addEventListener('click', () => sidebar.classList.toggle('collapsed'));
  newStoryBtn.addEventListener('click', newStory);

  deleteBtn.addEventListener('click', () => {
    const s = getActive();
    if(!s) return;
    if(!confirm(`"${s.title || 'Ohne Titel'}" wirklich löschen?`)) return;
    state.stories = state.stories.filter(x => x.id !== s.id);
    saveStories();
    if(state.stories.length){
      selectStory([...state.stories].sort((a,b)=>b.updated-a.updated)[0].id);
    } else {
      state.activeId = null;
      titleInput.value = '';
      editor.value = '';
      renderStoryList();
    }
  });

  exportBtn.addEventListener('click', () => {
    const s = getActive();
    if(!s) return;
    const blob = new Blob([s.text || ''], {type:'text/plain;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (s.title || 'geschichte').replace(/[^\w\-äöüÄÖÜß ]/g,'').trim() + '.txt';
    a.click();
  });

  // ===== Settings modal =====
  function renderPresetList(){
    presetList.innerHTML = '';
    state.settings.presets.forEach((p, i) => {
      const row = document.createElement('div');
      row.className = 'preset-row';
      row.innerHTML = `<input type="text" data-idx="${i}" value="${escapeHtml(p.model)}" placeholder="@preset/name oder Modell-ID">
        <button data-del="${i}" title="Entfernen">×</button>`;
      presetList.appendChild(row);
    });
    presetList.querySelectorAll('input').forEach(inp => {
      inp.addEventListener('input', e => {
        state.settings.presets[+e.target.dataset.idx].model = e.target.value;
        state.settings.presets[+e.target.dataset.idx].name = e.target.value;
      });
    });
    presetList.querySelectorAll('button[data-del]').forEach(btn => {
      btn.addEventListener('click', e => {
        state.settings.presets.splice(+e.target.dataset.del, 1);
        renderPresetList();
      });
    });
  }

  addPresetBtn.addEventListener('click', () => {
    state.settings.presets.push({ name:'', model:'', system:'' });
    renderPresetList();
  });

  function openSettings(){
    apiKeyInput.value = state.settings.apiKey || '';
    systemPromptInput.value = state.settings.defaultSystem || '';
    renderPresetList();
    settingsModal.style.display = 'flex';
  }
  settingsBtn.addEventListener('click', openSettings);
  closeSettings.addEventListener('click', () => settingsModal.style.display = 'none');
  saveSettingsBtn.addEventListener('click', () => {
    state.settings.apiKey = apiKeyInput.value.trim();
    state.settings.defaultSystem = systemPromptInput.value;
    saveSettings();
    populatePresetSelect();
    settingsModal.style.display = 'none';
  });

  function populatePresetSelect(){
    presetSelect.innerHTML = '';
    state.settings.presets.forEach((p, i) => {
      if(!p.model) return;
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = p.model;
      presetSelect.appendChild(opt);
    });
    if(!presetSelect.options.length){
      const opt = document.createElement('option');
      opt.textContent = 'Kein Preset — Einstellungen öffnen';
      presetSelect.appendChild(opt);
    }
  }

  // ===== Mode chips =====
  modebar.addEventListener('click', e => {
    const btn = e.target.closest('.mode-chip');
    if(!btn) return;
    mode = btn.dataset.mode;
    [...modebar.children].forEach(c => c.classList.toggle('active', c === btn));
    if(mode === 'continue') promptInput.placeholder = 'Optional: Richtung für die Fortsetzung…';
    if(mode === 'rewrite') promptInput.placeholder = 'Wie soll der bestehende Text umgeschrieben werden?';
    if(mode === 'scratch') promptInput.placeholder = 'Impuls, mit dem die Geschichte beginnt…';
  });

  // ===== Generation =====
  async function generate(){
    if(!state.activeId) newStory();
    const s = getActive();
    const presetIdx = presetSelect.value;
    const preset = state.settings.presets[presetIdx];
    if(!preset || !preset.model){
      statusLine.textContent = 'Kein Preset gewählt — Einstellungen öffnen.';
      return;
    }
    if(!state.settings.apiKey){
      statusLine.textContent = 'Kein API-Key hinterlegt — Einstellungen öffnen.';
      openSettings();
      return;
    }

    const existingText = editor.value;
    const userPrompt = promptInput.value.trim();
    const sys = preset.system || state.settings.defaultSystem || 'Du bist ein erfahrener Autor für erzählende Prosa. Schreibe stimmig, mit Blick für Charakter, Tempo und Atmosphäre, im Stil des bisherigen Textes weiter.';

    const charContext = activeCharacterContext();
    let messages = [{ role: 'system', content: sys + charContext }];
    let insertMode = 'append';

    if(mode === 'continue'){
      messages.push({ role: 'user', content:
        `Hier ist der bisherige Text der Geschichte:\n\n---\n${existingText || '(noch leer)'}\n---\n\n` +
        `Schreibe die Geschichte nahtlos weiter. ${userPrompt ? 'Richtung/Wunsch für die Fortsetzung: ' + userPrompt : 'Setze den Ton und die Handlung organisch fort.'}\n` +
        `Gib ausschließlich den neuen Fortsetzungstext aus, ohne Wiederholung des bisherigen Texts, ohne Meta-Kommentare.` });
      insertMode = 'append';
    } else if(mode === 'rewrite'){
      messages.push({ role: 'user', content:
        `Hier ist der bestehende Text:\n\n---\n${existingText || '(leer)'}\n---\n\n` +
        `Schreibe ihn um gemäß dieser Anweisung: ${userPrompt || 'verbessere Stil und Fluss, ohne die Handlung zu verändern.'}\n` +
        `Gib ausschließlich den vollständigen, überarbeiteten Text aus, ohne Meta-Kommentare.` });
      insertMode = 'replace';
    } else {
      messages.push({ role: 'user', content:
        `Beginne eine neue Geschichte basierend auf diesem Impuls: ${userPrompt || 'überrasche mich mit einem originellen Anfang.'}\n` +
        `Schreibe einen fesselnden Anfang von angemessener Länge. Gib ausschließlich den Erzähltext aus, ohne Meta-Kommentare.` });
      insertMode = 'replaceIfEmptyElseAppend';
    }

    genBtn.disabled = true;
    statusLine.textContent = 'Schreibt …';

    try{
      const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + state.settings.apiKey,
          'HTTP-Referer': 'https://feder.local',
          'X-Title': 'Feder'
        },
        body: JSON.stringify({
          model: preset.model,
          messages: messages,
          temperature: 0.9
        })
      });

      if(!res.ok){
        const errText = await res.text();
        throw new Error(`API-Fehler ${res.status}: ${errText.slice(0,200)}`);
      }
      const data = await res.json();
      const content = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
      if(!content) throw new Error('Keine Antwort erhalten.');

      if(insertMode === 'append'){
        editor.value = existingText + (existingText.trim() ? '\n\n' : '') + content.trim();
      } else if(insertMode === 'replace'){
        editor.value = content.trim();
      } else {
        editor.value = existingText.trim() ? existingText + '\n\n' + content.trim() : content.trim();
      }
      promptInput.value = '';
      persistActive();
      renderStoryList();
      statusLine.textContent = 'Fertig — ' + new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
      editor.scrollTop = editor.scrollHeight;
    } catch(err){
      statusLine.textContent = 'Fehler: ' + err.message;
    } finally {
      genBtn.disabled = false;
    }
  }

  genBtn.addEventListener('click', generate);
  promptInput.addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); generate(); }
  });

  // ===== Init =====
  load();
  state.stories.forEach(s => { if(!s.characterIds) s.characterIds = []; });
  populatePresetSelect();
  if(state.stories.length){
    const latest = [...state.stories].sort((a,b)=>b.updated-a.updated)[0];
    selectStory(latest.id);
  } else {
    newStory();
  }
  renderStoryList();

  if(window.innerWidth <= 720) sidebar.classList.add('collapsed');
})();
</script>

</body>
</html>
